
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thành viên</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Task Management</h1>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="tasks.html">Công việc</a>
            <a href="members.html">Thành viên</a>
        </nav>
    </header>

    <main>
        <h2>Danh sách thành viên</h2>

        <div class="toolbar">
            <select id="projectSelect">
                <option value="">-- Chọn dự án --</option>
            </select>

            <input
                type="text"
                id="memberSearch"
                placeholder="Tìm kiếm thành viên..."
            >

            <button id="addMemberBtn">+ Thêm thành viên</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Vai trò</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>

                <tbody id="memberList">
                    <!-- JavaScript hiển thị thành viên -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Form thêm thành viên -->
    <div id="memberModal" class="modal">
        <div class="modal-content">

            <h2>Thêm thành viên</h2>

            <form id="memberForm">

                <label>Email thành viên</label>
                <input
                    type="email"
                    id="memberEmail"
                    placeholder="Nhập email tài khoản đã đăng ký"
                    required
                >

                <label>Vai trò</label>
                <select id="memberRole">
                    <option value="member">Thành viên</option>
                    <option value="leader">Trưởng nhóm</option>
                </select>

                <div class="form-buttons">
                    <button type="submit">Lưu</button>
                    <button type="button" id="cancelMemberBtn">Hủy</button>
                </div>

            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/members.js"></script>

</body>
</html>
