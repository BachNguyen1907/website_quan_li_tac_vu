
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý công việc</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Task Management</h1>

        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="tasks.html">Công việc</a>
            <a href="members.html">Thành viên</a>
        </nav>
    </header>

    <main>
        <h2>Danh sách công việc</h2>

        <!-- Tìm kiếm và lọc -->
        <div class="toolbar"> 
            <select id="projectSelect">
               <option value="">-- Chọn dự án --</option>
            </select>
            <input
                type="text"
                id="searchInput"
                placeholder="Tìm kiếm công việc..."
            >

            <select id="statusFilter">
              <option value="">Tất cả trạng thái</option>
              <option value="todo">Chờ thực hiện</option>
              <option value="in_progress">Đang thực hiện</option>
              <option value="review">Chờ duyệt</option>
              <option value="done">Hoàn thành</option>
            </select>

            <button id="addTaskBtn">+ Thêm công việc</button>
        </div>

        <!-- Bảng công việc -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Tên công việc</th>
                        <th>Người thực hiện</th>
                        <th>Hạn hoàn thành</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>

                <tbody id="taskList">
                    <!-- JavaScript sẽ hiển thị dữ liệu ở đây -->
                </tbody>
            </table>
        </div>

    </main>

    <!-- Form thêm / sửa công việc -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm công việc</h2>

            <form id="taskForm">
                <label>Tên công việc</label>
                <input type="text" id="taskName" required>

                <label>Mô tả</label>
                <textarea id="taskDescription"></textarea>

                <label>Người thực hiện</label>
                <select id="taskAssignee" required>
                  <option value="">-- Chọn thành viên --</option>
                </select>

                <label>Hạn hoàn thành</label>
                <input type="date" id="taskDeadline" required>

                <label>Trạng thái</label>
                <select id="taskStatus">
                    <option value="todo">Chờ thực hiện</option>
                    <option value="in_progress">Đang thực hiện</option>
                    <option value="review">Chờ duyệt</option>
                 <option value="done">Hoàn thành</option>
                </select>

                <div class="form-buttons">
                    <button type="submit">Lưu</button>
                    <button type="button" id="cancelBtn">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/tasks.js"></script>

</body>
</html>
